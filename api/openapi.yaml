openapi: 3.1.0
info:
  title: DenDenMushi Incident Agent Worker API
  version: 0.1.0
  description: Internal worker health endpoints for SQS and Bedrock incident triage. Public Agentic AI APIs are served by agent-controlplane. Business endpoints require the `x-api-version: 1` header; probe and OpenAPI endpoints are exempt.
servers:
  - url: http://localhost:8091
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Service dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Service dependency check failed.
  /internal/worker/health:
    get:
      summary: Internal worker health and queue status
      responses:
        "200":
          description: Safe worker health metadata for agent-controlplane.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHealth"
  /openapi.yaml:
    get:
      summary: OpenAPI specification
      responses:
        "200":
          description: YAML OpenAPI document.
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ready
    AgentHealth:
      type: object
      required:
        - databaseReady
        - queueConsumerConfigured
        - queueConsumerRunning
        - activeIncidentCount
        - failedIncidentCount
      properties:
        databaseReady:
          type: boolean
        queueConsumerConfigured:
          type: boolean
        queueConsumerRunning:
          type: boolean
        lastAlertProcessedAt:
          type: string
          format: date-time
          nullable: true
        lastErrorSummary:
          type: string
        activeIncidentCount:
          type: integer
        failedIncidentCount:
          type: integer
