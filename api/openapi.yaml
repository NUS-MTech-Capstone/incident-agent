openapi: 3.1.0
info:
  title: DenDenMushi Incident Agent API
  version: 0.1.0
  description: Incident review endpoints. Incident pages are available as HTML, and the same routes return JSON for the Angular Agentic AI UI when requested with Accept application/json.
servers:
  - url: http://localhost:8091
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Service dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Service dependency check failed.
  /incidents:
    get:
      summary: List incidents
      security:
        - albCognito: []
      responses:
        "200":
          description: HTML incident list or JSON incident summaries.
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
                required: [incidents]
                properties:
                  incidents:
                    type: array
                    items:
                      $ref: "#/components/schemas/IncidentSummary"
        "401":
          description: Missing or invalid Cognito identity.
          content:
            text/plain:
              schema:
                type: string
  /incidents/{incidentId}:
    get:
      summary: Show incident detail
      security:
        - albCognito: []
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: HTML incident detail or JSON incident detail.
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
        "401":
          description: Missing or invalid Cognito identity.
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Incident not found.
          content:
            text/plain:
              schema:
                type: string
  /incidents/{incidentId}/approve:
    post:
      summary: Approve the exact proposed incident plan
      security:
        - albCognito: []
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DecisionForm"
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionForm"
      responses:
        "200":
          description: JSON updated incident detail when requested by the Angular UI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
        "303":
          description: HTML form submissions redirect to the incident detail page.
        "400":
          description: Identity or plan hash missing.
        "403":
          description: Cross-site decision rejected or user is not in Manager/Admin.
        "409":
          description: Incident changed; reload before deciding.
  /incidents/{incidentId}/reject:
    post:
      summary: Reject the exact proposed incident plan
      security:
        - albCognito: []
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DecisionForm"
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionForm"
      responses:
        "200":
          description: JSON updated incident detail when requested by the Angular UI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
        "303":
          description: HTML form submissions redirect to the incident detail page.
        "400":
          description: Identity or plan hash missing.
        "403":
          description: Cross-site decision rejected or user is not in Manager/Admin.
        "409":
          description: Incident changed; reload before deciding.
components:
  securitySchemes:
    albCognito:
      type: apiKey
      in: header
      name: x-amzn-oidc-data
  parameters:
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ready
    DecisionForm:
      type: object
      required: [planHash]
      properties:
        planHash:
          type: string
    IncidentSummary:
      type: object
      required: [id, alarmName, hostId, state, reason, runbookVersion, planHash, approvalDecision, createdAt, updatedAt]
      properties:
        id:
          type: string
        alarmName:
          type: string
        hostId:
          type: string
        state:
          type: string
          enum: [DIAGNOSING, AWAITING_APPROVAL, EXECUTING, COMPLETED, REJECTED, RECOVERED, FAILED]
        reason:
          type: string
        runbookVersion:
          type: string
        planHash:
          type: string
        approvalDecision:
          type: string
        approvalAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IncidentDetail:
      allOf:
        - $ref: "#/components/schemas/IncidentSummary"
        - type: object
          required: [sourceId, alarmArn, evidence, plan, approverSubject, report, errorMessage]
          properties:
            sourceId:
              type: string
            alarmArn:
              type: string
            evidence:
              type: array
              items:
                $ref: "#/components/schemas/OperationResult"
            plan:
              $ref: "#/components/schemas/Plan"
            approverSubject:
              type: string
            report:
              type: string
            errorMessage:
              type: string
    Plan:
      type: object
      required: [summary, rationale, actions]
      properties:
        summary:
          type: string
        rationale:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/PlanAction"
    PlanAction:
      type: object
      required: [operationId, reason]
      properties:
        operationId:
          type: string
        reason:
          type: string
    OperationResult:
      type: object
      required: [operationId, stdout, stderr, exitCode]
      properties:
        operationId:
          type: string
        stdout:
          type: string
        stderr:
          type: string
        exitCode:
          type: integer
