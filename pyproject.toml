[project]
name = "incident-agent"
version = "0.1.0"
description = "Python LangGraph baseline for DenDenMushi incident triage and approval-gated remediation."
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk>=1.1.5,<2",
  "alembic>=1.16.0",
  "boto3>=1.39.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.0",
  "langchain-aws>=0.2.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.5.0",
  "langsmith>=0.9.5,<0.10",
  "mcp>=2.2.0,<3",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "bandit>=1.8.0",
  "hatchling>=1.28.0",
  "jsonschema==4.26.0",
  "mypy>=1.16.0",
  "pip>=26.2",
  "pip-audit>=2.9.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=6.2.0",
  "pyyaml==6.0.3",
  "ruff>=0.12.0",
  "types-pyyaml==6.0.12.20250915",
]

[tool.uv]
constraint-dependencies = ["anyio>=4.14.2", "urllib3>=2.8.0", "langgraph-sdk>=0.4.4"]

[project.scripts]
incident-agent = "incident_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_agent"]
artifacts = ["src/incident_agent/py.typed"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "prompts"
"api/openapi.yaml" = "incident_agent/openapi.yaml"

[tool.hatch.build.targets.sdist.force-include]
"prompts" = "prompts"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "S"]
ignore = [
  "S101",
  "S608",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["incident_agent"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore.*", "langchain_aws", "a2a.*", "google.protobuf.*", "mcp.*", "httpx2"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["incident_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
