name: Image

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  image:
    permissions:
      contents: read
      id-token: write
    uses: NUS-MTech-Capstone/github-actions-shared/.github/workflows/docker-build-push-ecr.yaml@main
    with:
      aws-region: ap-southeast-1
      ecr-repository: dendenmushi/incident-agent
      extra-tags: ${{ github.ref_name }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    uses: NUS-MTech-Capstone/github-actions-shared/.github/workflows/promote-kubernetes-image.yaml@main
    with:
      service-name: incident-agent
      image-name: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/incident-agent
      image-tag: ${{ github.sha }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
