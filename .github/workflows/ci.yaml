name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    uses: NUS-MTech-Capstone/github-actions-shared/.github/workflows/python-ci.yaml@0a2ab816ffd50e835f0d3553343f544f59f4b41b
    with:
      python-version: "3.12"

  postgres-claims:
    name: PostgreSQL migrations and claims
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incident-agent
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: incident_agent_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d incident_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      INCIDENT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/incident_agent_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: incident-agent

      - name: Checkout evaluated approval implementation
        uses: actions/checkout@v7
        with:
          repository: NUS-MTech-Capstone/agent-controlplane
          ref: 321d6d4b142f3589fedaa5daa6f7c8aa5d193569
          path: agent-controlplane

      - name: Checkout evaluated dataplane implementation
        uses: actions/checkout@v7
        with:
          repository: NUS-MTech-Capstone/proxy-dataplane
          ref: 6a98eda4d96f0d842dbf0a4628f5181d03772114
          path: proxy-dataplane

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.9"
          cache-dependency-path: |
            agent-controlplane/go.sum
            proxy-dataplane/go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: incident-agent/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test migrations and concurrent claims
        run: make test-postgres

      - name: Evaluate deterministic scenarios
        run: uv run python -m evals.runner --mode deterministic --output /tmp/r12-rules-ci

      - name: Evaluate cross-service and PostgreSQL contracts
        run: uv run python -m evals.contracts --output /tmp/r12-contracts-ci

      - name: Retain sanitized evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluated-source-results
          path: /tmp/r12-*-ci/
          retention-days: 90

  openapi:
    uses: NUS-MTech-Capstone/github-actions-shared/.github/workflows/openapi-ci.yaml@0a2ab816ffd50e835f0d3553343f544f59f4b41b
