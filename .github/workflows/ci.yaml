name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    uses: NUS-MTech-Capstone/github-actions-shared/.github/workflows/python-ci.yaml@main
    with:
      python-version: "3.12"

  postgres-claims:
    name: PostgreSQL migrations and claims
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: incident_agent_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d incident_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      INCIDENT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/incident_agent_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test migrations and concurrent claims
        run: make test-postgres
